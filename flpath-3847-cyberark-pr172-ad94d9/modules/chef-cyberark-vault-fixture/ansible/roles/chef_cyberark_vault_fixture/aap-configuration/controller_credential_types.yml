---
controller_credential_types:
- name: CyberArk Conjur Database
  description: Credential type for CyberArk Conjur Database
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Database Username
      help_text: Username for database connection retrieved from Conjur path x2a-test/production/database/username
    - id: password
      type: string
      label: Database Password
      secret: true
      help_text: Password for database connection retrieved from Conjur path x2a-test/production/database/password
    - id: conjur_path_prefix
      type: string
      label: Conjur Path Prefix
      help_text: Base path for Conjur secrets (e.g., x2a-test/production)
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      conjur_path_prefix: !unsafe '{{ conjur_path_prefix }}'
